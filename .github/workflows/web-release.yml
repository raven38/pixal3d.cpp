name: Web alpha release

on:
  push:
    tags:
      - 'v*-web-alpha'
    branches:
      - 'release/web-alpha-publish'

permissions:
  contents: write

env:
  EMSDK_VERSION: 6.0.9

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v0.9.0-web-alpha"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - name: Build release WebGPU/WASM runtime
        run: bash scripts/build_wasm_real_geometry.sh --fresh --build-dir build-wasm-web-release

      - name: Resolve model revisions and make metadata
        shell: bash
        run: |
          set -euo pipefail
          MV_SHA="$(curl -fsSL https://huggingface.co/api/models/raven38/pixal3d-q8_0-v1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          SV_SHA="$(curl -fsSL https://huggingface.co/api/models/raven38/pixal3d-sv-q8_0-v1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          sha256sum web/real_e2e/pixal3d_real_geometry.js web/real_e2e/pixal3d_real_geometry.wasm > web/real_e2e/SHA256SUMS
          python3 - "$MV_SHA" "$SV_SHA" <<'PY'
          import json, os, sys
          mv, sv = sys.argv[1:3]
          info = json.load(open("web/real_e2e/build-info.json"))
          out = {
              "tag": os.environ["RELEASE_TAG"],
              "app_commit": os.environ["SOURCE_COMMIT"],
              "runtime": info,
              "mv_model_revision": mv,
              "sv_model_revision": sv,
              "mv_manifest": f"https://huggingface.co/raven38/pixal3d-q8_0-v1/resolve/{mv}/pixal3d-models.json",
              "sv_manifest": f"https://huggingface.co/raven38/pixal3d-sv-q8_0-v1/resolve/{sv}/pixal3d-models.json",
          }
          json.dump(out, open("web-release-metadata.json","w"), indent=2)
          open("web-release-metadata.json","a").write("\n")
          PY

      - name: Prepare release notes
        shell: bash
        run: |
          cat > web-release-notes.md <<EOF
          # Pixal3D Web alpha

          Browser-local Pixal3D inference with verified MV and SV Q8_0 model sets.

          - App/source commit: \`${SOURCE_COMMIT}\`
          - WebGPU/WASM: Emscripten 6.0.9; exact digests are attached in \`SHA256SUMS\`
          - Model revisions and manifests: see \`web-release-metadata.json\`
          - Verified target: Chrome/Chromium + WebGPU, resolution 1024
          - SV: dedicated single-view flow family; canonical 20° / manual FOV in the browser
          - MV: canonical 4-view path; native helper also supports MoGe-2 shared-FOV estimation
          - Model files remain hosted separately on Hugging Face and are verified by exact size + SHA-256.

          Known limitations:
          - Browser-native automatic FOV estimation is not included yet (#12).
          - Arbitrary multi-view pose estimation remains follow-up work (#4).
          - 1536 browser generation is not part of the initial support matrix.
          - Generation is resource intensive and may take tens of minutes.

          Production: https://pixal3d-web.raven38.workers.dev/
          EOF

      - name: Create prerelease and upload immutable runtime provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to create a duplicate"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --prerelease \
            --title "Pixal3D Web alpha ${RELEASE_TAG#v}" \
            --notes-file web-release-notes.md \
            web/real_e2e/pixal3d_real_geometry.js \
            web/real_e2e/pixal3d_real_geometry.wasm \
            web/real_e2e/build-info.json \
            web/real_e2e/SHA256SUMS \
            web-release-metadata.json
