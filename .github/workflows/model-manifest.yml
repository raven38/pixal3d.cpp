name: Model manifest smoke

on:
  pull_request:
    paths:
      - 'models/pixal3d-model-set.schema.json'
      - 'models/*/pixal3d-models.json'
      - 'tools/model_manifest.py'
      - 'web/app/manifest_conformance.json'
      - 'docs/PIXAL3D_RELEASE_CHECKLIST.md'
      - '.github/workflows/model-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'models/pixal3d-model-set.schema.json'
      - 'models/*/pixal3d-models.json'
      - 'tools/model_manifest.py'
      - 'web/app/manifest_conformance.json'
      - 'docs/PIXAL3D_RELEASE_CHECKLIST.md'
      - '.github/workflows/model-manifest.yml'
  workflow_dispatch:

concurrency:
  group: model-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Verify generator and corrupt-file detection
        run: python tools/model_manifest.py self-test
      - name: Verify JSON Schema and Python contract agree
        run: python tools/model_manifest.py schema-test
      - name: Verify committed release manifest identity
        run: python tools/model_manifest.py check-committed
