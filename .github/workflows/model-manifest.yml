name: Model manifest smoke

on:
  pull_request:
    paths:
      - 'models/pixal3d-model-set.schema.json'
      - 'tools/model_manifest.py'
      - '.github/workflows/model-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'models/pixal3d-model-set.schema.json'
      - 'tools/model_manifest.py'
      - '.github/workflows/model-manifest.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Verify generator and corrupt-file detection
        run: python tools/model_manifest.py self-test
      - name: Verify JSON Schema and Python contract agree
        run: python tools/model_manifest.py schema-test
