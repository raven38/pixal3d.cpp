name: Installer manifest smoke

on:
  pull_request:
    paths:
      - 'install/install.sh'
      - 'install/install.ps1'
      - 'install/test_installer_manifest.sh'
      - 'install/test_installer_manifest.ps1'
      - 'web/app/manifest_conformance.json'
      - '.github/workflows/installer-manifest-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'install/install.sh'
      - 'install/install.ps1'
      - 'install/test_installer_manifest.sh'
      - 'install/test_installer_manifest.ps1'
      - 'web/app/manifest_conformance.json'
      - '.github/workflows/installer-manifest-smoke.yml'
  workflow_dispatch:

concurrency:
  group: installer-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-models:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 0.10.0: MV + SV の 2 ディレクトリ契約。無傷の受理、破損・欠損・サイズ不一致・
      # トラバーサル・family 取り違え・混在 manifest の拒否、conformance vector 18 件、
      # そして Linux では --asset-base-url 経由の実インストール経路（modelsDirSv の書き出し、
      # SV 失敗時に MV が無傷・config 未書き込み・.part 無し、空き容量の事前拒否）。
      - name: Linux installer contract (bash 5)
        if: runner.os == 'Linux'
        shell: bash
        run: bash install/test_installer_manifest.sh
      - name: Windows PowerShell 7 installer contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File install/test_installer_manifest.ps1
          if ($LASTEXITCODE -ne 0) { throw "installer contract failed: rc=$LASTEXITCODE" }
      - name: Diagnose Windows PowerShell 5.1 UTF-8 file parsing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 reads UTF-8 files without a BOM as ANSI. Parse the
          # same bytes after explicit UTF-8 decoding to distinguish an encoding problem
          # from a real PowerShell syntax problem.
          $text = [System.IO.File]::ReadAllText((Resolve-Path 'install/install.ps1'), [System.Text.Encoding]::UTF8)
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Host; throw 'install.ps1 has real syntax errors after explicit UTF-8 decoding' }
          Write-Host 'INSTALLER_PS51_UTF8_PARSE_OK'
