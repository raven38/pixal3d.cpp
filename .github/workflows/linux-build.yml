name: Linux C++ build

# src/ の C++ が Linux/GCC で壊れていないかを見る。macOS の clang は int64_t が
# long long、Linux/GCC は long なので、型推論まわりは macOS で通っても Linux で
# 落ちることがある（2026-09-09 に src/dit.cpp のラムダ戻り型で実際に起きた。
# CUDA pod でビルドするまで誰も気付かなかった）。GPU は要らない —— あの不具合は
# ホストコンパイラだけで検出できる。
on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - 'patches/ggml-cuda/**'
      - '.gitmodules'
      - 'install/generate.sh'
      - 'install/test_natural_order.sh'
      - 'install/test_pixal3d_weight_selection.sh'
      - 'tests/**'
      - 'tools/run_pixal3d_estimated.py'
      - 'tools/test_crop_parity.py'
      - 'tools/ref_trellis2_mv.py'
      - '.github/workflows/linux-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'thirdparty/**'
      - 'patches/ggml-cuda/**'
      - '.gitmodules'
      - 'install/generate.sh'
      - 'install/test_natural_order.sh'
      - 'install/test_pixal3d_weight_selection.sh'
      - 'tests/**'
      - 'tools/run_pixal3d_estimated.py'
      - 'tools/test_crop_parity.py'
      - 'tools/ref_trellis2_mv.py'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:

concurrency:
  group: linux-cpp-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:


  cuda-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu22.04
    strategy:
      fail-fast: false
      matrix:
        async_y: [OFF, ON]
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ pkg-config
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CUDA sm80
        run: |
          cmake -B build-cuda-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_BLAS=OFF \
            -DTRELLIS_WEBP=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=80 \
            -DPIXAL3D_CUDA_Q8_ASYNC_Y=${{ matrix.async_y }}
          nvcc --version

      - name: Compile ggml-cuda and DiT bench
        run: |
          cmake --build build-cuda-ci --target ggml-cuda trellis-test-dit-bench -j 2

  linux-cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Run the weightless TRELLIS.2 multi-image sampler oracle
        run: python3 tools/ref_trellis2_mv.py --selftest

      # ccache が無いと webp / ggml を PR ごとに全ビルドする（configure が
      # "Warning: ccache not found" を出していた）。
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-cpu
          max-size: 500M

      - name: Configure (CPU backend only)
        # GPU backend は付けない。目的はホストコンパイラでの移植性チェックで、
        # CUDA/Vulkan SDK を入れるとビルド時間が数倍になる。
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cc --version | head -1
          c++ --version | head -1

      - name: Build everything configured
        # CLI・server・src/test_*.cpp の全ターゲット。CPU 構成で configure された
        # ものだけが対象なので、CUDA 専用テスト（trellis-test-fa-* 等）は含まれない。
        # -k 0 で最初のエラーで止めず、移植エラーを 1 回のログで棚卸しできるようにする。
        # `-- -k 0` は Ninja 固有の書式。ジェネレータを Make に変えるならここも変える。
        # 重みが要るので実行はしない（ビルドが通ることだけを見る）。
        run: cmake --build build -j "$(nproc)" -- -k 0

      # canonical rig の契約（合成結果が同梱 transforms.json とビット一致・異常系が
      # fail closed・自然順）と、権限/走査エラーの扱いを Linux で実際に動かす。
      - name: Run the weightless canonical-rig test
        run: ./build/trellis-test-transforms-synth docker/linux-webgpu-gate/e2e/views

      # install/generate.sh の natural_sort が C++ の natural_name_less と同じ順序かを、
      # GNU coreutils 側でも確認する（macOS の BSD sort とは別実装のため両方で回す）。
      - name: Check the shell natural order against the C++ comparator
        run: ./install/test_natural_order.sh build/trellis-test-transforms-synth

      # 実モデルは不要。空の model dir で fail-fast させ、既定が MV のまま・明示 SV が
      # MV に黙ってフォールバックしないことと、0 < FOV < pi の camera 契約を固定する。
      - name: Check Pixal3D weight selection and FOV contract
        run: bash ./install/test_pixal3d_weight_selection.sh ./build/trellis-cli

      # DiT の 3D RoPE（de-interleaved レイアウト）をホスト参照と突き合わせ、q·k が
      # 置換に対して不変であることを見る。重み不要・GPU 不要（-1 = CPU backend のみ）。
      - name: Run the RoPE layout test
        run: ./build/trellis-test-rope-layout -1

      # 単一視点（SV）入力の契約: gauge カメラ・pre-matted クロップ・ブラウザ実装との一致
      # （共有フィクスチャ tests/fixtures/sv_gauge）。外部ファイル不要、リポジトリルートで実行。
      - name: Run the single-view input contract test
        run: ./build/trellis-test-sv-input tests/fixtures/sv_gauge

      # Python 実装（tools/run_pixal3d_estimated.py）と C++ のクロップが同じ矩形を返すこと。
      - name: Check crop parity between Python and C++
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/test_crop_parity.py ./build/trellis-test-sv-input

      # trellis-server の HTTP 契約: /health 不変・/capabilities の判定・/generate-sv の
      # fail-closed・busy/completed。モデル重みは要らない（manifest + sparse ファイル）。
      - name: Run the trellis-server contract test
        run: bash tests/server_contract.sh ./build/trellis-server

      - name: Show binaries
        if: always()
        run: ls -la build/trellis-cli build/trellis-server build/trellis-test-* 2>/dev/null | head -30
