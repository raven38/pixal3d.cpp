name: Web production UI smoke

on:
  pull_request:
    paths:
      - 'web/app/**'
      - 'web/real_e2e/calibration.js'
      - '.github/workflows/web-app-headless.yml'
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run weightless input contracts
        working-directory: web
        run: |
          npm run test:rig
          npm run test:single-view
          npm run test:moge-focal
      - name: Serve repository
        run: |
          python3 -m http.server 8199 --bind 127.0.0.1 > /tmp/pixal3d-web.log 2>&1 &
          echo $! > /tmp/pixal3d-web.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8199/web/app/ >/dev/null && exit 0; sleep .5; done
          cat /tmp/pixal3d-web.log; exit 1
      - name: Run production UI smoke
        env:
          WEB_APP_URL: http://127.0.0.1:8199/web/app/
        run: node web/app/test_headless.mjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/pixal3d-web.log || true
